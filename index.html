<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rolling Oaks Club</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rolling Oaks">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<style>
  /* This page holds the tools' full-screen frames. It exists so the Apps Script
     pages load inside it, which is what hides Google's blue banner. Home, Pump and
     Chemistry stay loaded once opened, and switching just shows a different frame. */
  html, body { margin: 0; height: 100%; background: #111; }
  @media (prefers-color-scheme: light) { html, body { background: #fff; } }
  .tool { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; visibility: hidden; pointer-events: none; z-index: 0; }
  .tool.on { visibility: visible; pointer-events: auto; z-index: 1; }
  @supports (height: 100dvh) { .tool { height: 100dvh; } }
  /* donation popup (Zeffy form), opened by a tool's Donate button */
  .give-back { position: fixed; inset: 0; z-index: 20; background: rgba(8,6,3,.62); opacity: 0; transition: opacity .25s; }
  .give-panel:focus { outline: none; }
  .give-panel { position: fixed; z-index: 21; left: 50%; top: 50%; width: min(560px, calc(100vw - 32px)); height: min(860px, calc(100vh - 48px));
    transform: translate(-50%, -48%); opacity: 0; transition: opacity .25s, transform .25s; display: flex; flex-direction: column;
    background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 24px 60px rgba(0,0,0,.45); }
  .give-back[hidden], .give-panel[hidden] { display: none; }
  .give-open .give-back { opacity: 1; }
  .give-open .give-panel { opacity: 1; transform: translate(-50%, -50%); }
  .give-head { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; outline: none;
    background: #140F09; color: #FFF8EC; font: 600 15px/1.2 "Jost", "Avenir Next", "Futura", "Segoe UI", system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; }
  .give-head span b { color: #D69A4A; font-weight: 600; }
  .give-body { position: relative; flex: 1; background: #fff; }
  .give-body iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .give-wait { position: absolute; inset: 0; display: grid; place-items: center; color: #6b6259; font: 15px system-ui, sans-serif; }
  @media (max-width: 768px) {
    .give-panel { left: 0; right: 0; bottom: 0; top: calc(env(safe-area-inset-top, 0px) + 56px); width: auto; height: auto;
      border-radius: 16px 16px 0 0; transform: translateY(100%); opacity: 1; }
    .give-open .give-panel { transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) { .give-back, .give-panel { transition: none; } }
  noscript { color: #999; font: 16px/1.4 system-ui, sans-serif; display: block; padding: 24px; }
  noscript a { color: inherit; }
</style>
</head>
<body>
<noscript>This page needs JavaScript. You can also open the tools directly:
  <a href="https://script.google.com/macros/s/AKfycbywGYJQBb5hk5dVoUE6bCQ_FwaSUun_pYGMAinYy0VgBIFaDwOoEXwdHP48EzFSmWy97A/exec">Home</a>.</noscript>
<script>
// The three tools. If a tool's Apps Script address ever changes, edit it here
// (this is the only place it lives now, besides the wrapper links inside each tool).
var TOOLS = {
  // bg: [light, dark] colour behind the frame. On iPhone Safari this colours the BOTTOM bar; the top bar takes the
  // background colour of the page inside the frame (Home sets near-black). Home: deep pool teal-slate.
  home: { title: 'Rolling Oaks Club', bg: ['#2E4748', '#2E4748'], top: '#16110B',
          url: 'https://script.google.com/macros/s/AKfycbywGYJQBb5hk5dVoUE6bCQ_FwaSUun_pYGMAinYy0VgBIFaDwOoEXwdHP48EzFSmWy97A/exec' },
  pump: { title: 'Rolling Oaks Club - Water Systems Dashboard',
          url: 'https://script.google.com/macros/s/AKfycbyT2vJWAEfvHBqsMxAdcuO4xUCuDDVUZ6Uw-0xbxJSfFM0rsj0oJNRX53gclWo-hWMRQg/exec' },
  chem: { title: 'Rolling Oaks Club - Pool Chemistry Dashboard',
          url: 'https://script.google.com/macros/s/AKfycbzLpS38sr24wHiNVOI8ZdR_hiHaMhLyOcp51w-Rek-U9yTLJZ3FEIwJn5sZSwnzSPgz/exec' },
  // The Pump Log (Well Log Tool) - Board and Manager only. Deliberately NOT linked from Home or the page menus; it keeps
  // its own home-screen icon, name and colors so it feels like its own app. The old address
  // github.io/Pump-log-icon/ now just forwards here (same site, so a saved home-screen icon keeps working).
  log:  { title: 'Pump Log', appTitle: 'Pump Log', icon: 'log-icon.png', bg: ['#FAF7F1', '#1B1712'],
          url: 'https://script.google.com/macros/s/AKfycbxuGpuW9uzpKp97sc9vTkFS5o_1WoonL7_q9fH0SH-HJJAZ3Dy29LtqreUofuBLp238/exec' }
};
var BASE_TITLE = document.title;
var FRAMES = {}, INNER = {}, HIDDEN_AT = {}, current = null;
var SWITCHABLE = { home: 1, pump: 1, chem: 1 };      // these switch in place; the Pump Log stays its own app
var PRELOAD = { home: 1, chem: 1 };                   // loaded in the background; Pump loads the first time it's opened (keeps data light)
// Chemistry is only preloaded for someone signed in (Home only shows the dashboard buttons to them)
function signedIn() { try { return !!localStorage.getItem('rocSignIn'); } catch (x) { return false; } }
var STALE_MS = 2 * 60 * 60 * 1000;                        // a page hidden longer than this reloads when shown again
function pageFrom(search) {
  var p = (new URLSearchParams(search).get('p') || 'home').toLowerCase();
  return TOOLS[p] ? p : 'home';
}
function frameFor(p) {
  if (FRAMES[p]) return FRAMES[p];
  var f = document.createElement('iframe');
  f.className = 'tool'; f.title = TOOLS[p].title; f.setAttribute('allow', 'fullscreen');
  f.src = TOOLS[p].url;
  document.body.appendChild(f);
  return (FRAMES[p] = f);
}
function show(p, push) {
  var tool = TOOLS[p];
  if (current === p) return;
  if (current) HIDDEN_AT[current] = Date.now();
  var f = frameFor(p);
  if (HIDDEN_AT[p] && Date.now() - HIDDEN_AT[p] > STALE_MS) { INNER[p] = null; f.src = TOOLS[p].url; }
  HIDDEN_AT[p] = 0;
  Object.keys(FRAMES).forEach(function (k) { FRAMES[k].classList.toggle('on', k === p); });
  current = p;
  document.title = tool.title || BASE_TITLE;
  applyBg(tool);
  if (push) history.pushState({ p: p }, '', '?p=' + p);
}
var start = pageFrom(location.search), tool = TOOLS[start];
history.replaceState({ p: start }, '', location.search || '?p=' + start);
// a tool with its own look: icon + name for "Add to Home Screen", and the colors behind the frame / status bar
if (tool.icon) {
  document.querySelector('link[rel="apple-touch-icon"]').href = tool.icon;
  document.querySelector('link[rel="icon"]').href = tool.icon;
}
if (tool.appTitle) document.querySelector('meta[name="apple-mobile-web-app-title"]').content = tool.appTitle;
// the colours behind the frame / status bar follow the page being shown (default: white in light mode, #111 in dark)
var bgStyle = document.createElement('style'); document.head.appendChild(bgStyle);
function applyBg(t) {
  var bg = t.bg || ['#ffffff', '#111111'];
  bgStyle.textContent = 'html, body { background: ' + bg[1] + '; } @media (prefers-color-scheme: light) { html, body { background: ' + bg[0] + '; } }';
  document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
    m.content = t.top || (/dark/.test(m.getAttribute('media')) ? bg[1] : bg[0]);
  });
}
show(start, false);
// once the first page is up, quietly load the others in PRELOAD so switching to them is instant
if (SWITCHABLE[start]) {
  var preloaded = false;
  var preload = function () {
    if (preloaded) return; preloaded = true;
    Object.keys(PRELOAD).forEach(function (k, n) { if (k === 'chem' && !signedIn()) return; if (!FRAMES[k]) setTimeout(function () { frameFor(k); }, n * 800); });
  };
  FRAMES[start].addEventListener('load', function () { setTimeout(preload, 2500); });
  setTimeout(preload, 8000);
  // signed in: start Chemistry at once alongside the first page (it needs ~3-5 s from Google, then its readings), so it is
  // usually ready by the time someone taps it on Home
  if (start !== 'chem' && signedIn()) setTimeout(function () { frameFor('chem'); }, 300);
}
// iPhone: typing in a tool (sign-in) can scroll this page under the frame, and it may stay shifted after the keyboard closes,
// so taps land off from the buttons. This page never scrolls, so put it back at the top whenever it moves.
function unshift() { if (window.scrollX || window.scrollY) window.scrollTo(0, 0); }
window.addEventListener('scroll', unshift);
if (window.visualViewport) window.visualViewport.addEventListener('resize', function () { setTimeout(unshift, 100); });
window.addEventListener('popstate', function (e) {
  var p = (e.state && e.state.p) || pageFrom(location.search);
  if (SWITCHABLE[p] && SWITCHABLE[current]) show(p, false); else location.reload();
});

// Sign in once for every tool. When someone signs in on any tool, that tool sends its key number / password up here;
// this page keeps it (its own storage survives reloads, unlike storage inside the frame) and hands it to each tool
// that asks when it loads. Sign in / out on one tool is passed on to the others that are already loaded.
// Only ever given to the tools in THIS page's frames (Apps Script pages, *.googleusercontent.com), and never when
// this page is itself inside someone else's frame.
var SIGNIN_KEY = 'rocSignIn', LEVEL_KEY = 'rocLevel';   // rocLevel: {level, who} from the last good check, so tools can show it at once
function toolOf(e) {
  if (window.top !== window) return null;
  if (!/^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/.test(e.origin)) return null;
  for (var w = e.source, i = 0; w && i < 6; i++) {       // the tool's page sits a frame or two inside ours
    for (var k in FRAMES) if (w === FRAMES[k].contentWindow) return k;
    if (w === w.parent) break;
    w = w.parent;
  }
  return null;
}
function tellOthers(from, msg) {
  Object.keys(INNER).forEach(function (k) {
    if (k !== from && INNER[k]) { try { INNER[k].win.postMessage(msg, INNER[k].origin); } catch (x) {} }
  });
}
function level() { try { return JSON.parse(localStorage.getItem(LEVEL_KEY) || '{}') || {}; } catch (x) { return {}; } }
window.addEventListener('message', function (e) {
  var from = toolOf(e);
  if (!from) return;
  var d = e.data || {};
  try {
    if (d.roc === 'hello') {
      INNER[from] = { win: e.source, origin: e.origin };
      var lv = level();
      e.source.postMessage({ roc: 'code', code: localStorage.getItem(SIGNIN_KEY) || '', level: lv.level || '', who: lv.who || '', donate: true }, e.origin);
    } else if (d.roc === 'save' && typeof d.code === 'string' && d.code.length < 200) {
      var changed = localStorage.getItem(SIGNIN_KEY) !== d.code;
      localStorage.setItem(SIGNIN_KEY, d.code);
      if (/^(member|board|manager)$/.test(d.level || '')) localStorage.setItem(LEVEL_KEY, JSON.stringify({ level: d.level, who: String(d.who || '').slice(0, 80) }));
      if (changed && SWITCHABLE[current] && !FRAMES.chem) setTimeout(function () { if (signedIn()) frameFor('chem'); }, 1500);  // just signed in: load it now
      if (changed) { var l2 = level(); tellOthers(from, { roc: 'code', code: d.code, level: l2.level || '', who: l2.who || '' }); }
    } else if (d.roc === 'forget') {
      var had = !!localStorage.getItem(SIGNIN_KEY);
      localStorage.removeItem(SIGNIN_KEY); localStorage.removeItem(LEVEL_KEY);
      if (had) tellOthers(from, { roc: 'signout' });
    } else if (d.roc === 'donate') {
      openDonate();
    } else if (d.roc === 'go' && SWITCHABLE[d.p] && SWITCHABLE[from]) {
      e.source.postMessage({ roc: 'went' }, e.origin);
      show(d.p, true);
    }
  } catch (err) {}
});

// Donation popup: the Zeffy form in a frame of our own, loaded the first time Donate is tapped (not on every visit).
// Same form and link as Zeffy's own popup script; this page is the top page, so Apple Pay / Google Pay can work
// (the frame has allow="payment"). Closing: Zeffy's own X (it sends {id:'zeffy-iframe', close:true}), tapping the dimmed
// page around the popup (a strip stays visible above it on phones), or Esc.
var DONATE_URL = 'https://www.zeffy.com/embed/donation-form/help-support-the-club-and-grounds?modal=true';
var give = null, giveReturn = null;
function openDonate() {
  if (!give) {
    var back = document.createElement('div'); back.className = 'give-back';
    var panel = document.createElement('div'); panel.className = 'give-panel';
    panel.setAttribute('role', 'dialog'); panel.setAttribute('aria-modal', 'true'); panel.setAttribute('aria-label', 'Donate to Rolling Oaks Club');
    panel.innerHTML = '<div class="give-head"><span>Support the <b>Club &amp; Grounds</b></span></div>' +
      '<div class="give-body"><div class="give-wait">Loading secure donation form\u2026</div></div>';
    var f = document.createElement('iframe');
    f.title = 'Donation form, powered and secured by Zeffy'; f.setAttribute('allow', 'payment');
    f.addEventListener('load', function () { var w = panel.querySelector('.give-wait'); if (w) w.remove(); try { f.contentWindow.postMessage({ id: 'zeffy-iframe', open: true }, '*'); } catch (x) {} });
    f.src = DONATE_URL;
    panel.querySelector('.give-body').appendChild(f);
    document.body.appendChild(back); document.body.appendChild(panel);
    back.addEventListener('click', closeDonate);
    give = { back: back, panel: panel, frame: f };
  } else {
    try { give.frame.contentWindow.postMessage({ id: 'zeffy-iframe', open: true }, '*'); } catch (x) {}
  }
  giveReturn = document.activeElement;
  give.back.hidden = false; give.panel.hidden = false;
  Object.keys(FRAMES).forEach(function (k) { FRAMES[k].setAttribute('aria-hidden', 'true'); });
  give.panel.tabIndex = -1;
  setTimeout(function () { document.body.classList.add('give-open'); try { give.panel.focus(); } catch (x) {} }, 20);
}
function closeDonate() {
  if (!give || !document.body.classList.contains('give-open')) return;
  document.body.classList.remove('give-open');
  Object.keys(FRAMES).forEach(function (k) { FRAMES[k].removeAttribute('aria-hidden'); });
  setTimeout(function () { give.back.hidden = true; give.panel.hidden = true; }, 260);
  if (giveReturn && giveReturn.focus) try { giveReturn.focus(); } catch (x) {}
}
window.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeDonate(); });
window.addEventListener('message', function (e) {
  if (e.origin === 'https://www.zeffy.com' && e.data && e.data.id === 'zeffy-iframe' && e.data.close) closeDonate();
});
</script>
</body>
</html>
